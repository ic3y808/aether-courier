name: build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  emailkit-tests:
    name: EmailKit unit tests
    runs-on: macos-26   # Xcode 26 / Swift 6.2 — EmailKit needs swift-tools-version 6.2
    steps:
      - uses: actions/checkout@v4
      - name: Run mail-engine tests
        working-directory: EmailKit
        run: swift test

  app-build:
    name: App build (xcodegen)
    runs-on: macos-26   # Xcode 26 / Swift 6.2
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build
        run: |
          xcodebuild \
            -project Aether-Courier.xcodeproj \
            -scheme Aether-Courier \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build
