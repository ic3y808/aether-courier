<svg width="560" height="900" viewBox="0 0 560 900" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#16111f"/><stop offset="1" stop-color="#0a0710"/></linearGradient>
    <radialGradient id="bV" cx="18%" cy="6%" r="60%"><stop offset="0" stop-color="#7c3aed" stop-opacity="0.55"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient>
    <radialGradient id="bM" cx="96%" cy="8%" r="60%"><stop offset="0" stop-color="#ec4899" stop-opacity="0.42"/><stop offset="1" stop-color="#ec4899" stop-opacity="0"/></radialGradient>
    <radialGradient id="bB" cx="60%" cy="112%" r="70%"><stop offset="0" stop-color="#3b82f6" stop-opacity="0.40"/><stop offset="1" stop-color="#3b82f6" stop-opacity="0"/></radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9a6bff"/><stop offset="1" stop-color="#ec4899"/></linearGradient>
    <linearGradient id="glassTop" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/><stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="34" flood-color="#000" flood-opacity="0.5"/></filter>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="46"/></filter>
  </defs>

  <rect width="560" height="900" fill="url(#bg)"/>
  <rect width="560" height="900" fill="url(#bV)"/><rect width="560" height="900" fill="url(#bM)"/><rect width="560" height="900" fill="url(#bB)"/>
  <circle cx="120" cy="120" r="120" fill="#8b5cf6" opacity="0.22" filter="url(#blur)"/>
  <circle cx="470" cy="760" r="150" fill="#ec4899" opacity="0.16" filter="url(#blur)"/>

  <!-- panel -->
  <g filter="url(#sh)"><rect x="36" y="40" width="488" height="820" rx="26" fill="#171225" fill-opacity="0.92"/></g>
  <rect x="36" y="40" width="488" height="820" rx="26" fill="url(#glassTop)"/>
  <rect x="36.5" y="40.5" width="487" height="819" rx="25.5" fill="none" stroke="#ffffff" stroke-opacity="0.14"/>

  <!-- header -->
  <circle cx="76" cy="82" r="15" fill="url(#accent)"/><text x="76" y="88" font-size="15" fill="#fff" text-anchor="middle">✦</text>
  <text x="100" y="88" font-size="19" font-weight="700" fill="#f3eefc">Copilot</text>
  <rect x="440" y="70" width="64" height="26" rx="13" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.14"/>
  <circle cx="458" cy="83" r="4" fill="#28c840"/><text x="470" y="87" font-size="12" fill="#c3bcdc">local</text>
  <line x1="60" y1="112" x2="500" y2="112" stroke="#ffffff" stroke-opacity="0.08"/>

  <!-- For this email card -->
  <rect x="60" y="132" width="440" height="92" rx="16" fill="#8d5cf7" fill-opacity="0.16"/>
  <rect x="60.5" y="132.5" width="439" height="91" rx="15.5" fill="none" stroke="#ffffff" stroke-opacity="0.14"/>
  <circle cx="96" cy="178" r="20" fill="url(#accent)"/><text x="96" y="184" font-size="17" fill="#fff" text-anchor="middle">✦</text>
  <text x="128" y="164" font-size="12" font-weight="700" fill="#b7addb" letter-spacing="1.4">FOR THIS EMAIL</text>
  <text x="128" y="188" font-size="17" font-weight="700" fill="#ffffff">New voicemail from (415) 555‑0142</text>
  <text x="128" y="208" font-size="13" fill="#a99fca">Orbit Voicemail</text>

  <!-- SUGGESTED -->
  <text x="60" y="256" font-size="12" font-weight="700" fill="#8a83a8" letter-spacing="1.6">SUGGESTED</text>

  <!-- chips -->
  <g font-size="15" fill="#ece7fb" font-weight="500">
    <g transform="translate(60,272)">
      <rect width="440" height="46" rx="13" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
      <circle cx="30" cy="23" r="11" fill="none" stroke="#b98cff" stroke-width="1.6"/><path d="M 26 18 l 9 5 l -9 5 z" fill="#b98cff"/>
      <text x="52" y="28">Play voicemail</text>
    </g>
    <g transform="translate(60,328)">
      <rect width="440" height="46" rx="13" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
      <rect x="20" y="14" width="20" height="15" rx="4" fill="none" stroke="#b98cff" stroke-width="1.6"/><path d="M 24 33 l 4 -4 h 8" fill="none" stroke="#b98cff" stroke-width="1.6" stroke-linecap="round"/>
      <text x="52" y="28">Read the transcript</text>
    </g>
    <g transform="translate(60,384)">
      <rect width="215" height="46" rx="13" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
      <path d="M 20 18 h 7 l 3 3 h 9 a 3 3 0 0 1 3 3 v 8 a 3 3 0 0 1 -3 3 h -19 a 3 3 0 0 1 -3 -3 v -11 a 3 3 0 0 1 3 -3 z" fill="none" stroke="#b98cff" stroke-width="1.6"/>
      <text x="52" y="28" font-size="14">Move to “Work”</text>
    </g>
    <g transform="translate(285,384)">
      <rect width="215" height="46" rx="13" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="24" y="28" font-size="15" fill="#b98cff">✦</text>
      <text x="46" y="28" font-size="14">Summarize</text>
    </g>
  </g>

  <!-- assistant response bubble -->
  <rect x="60" y="452" width="440" height="270" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="82" y="486" font-size="14" font-weight="600" fill="#efeafb">Voicemail transcript</text>
  <g font-size="14" fill="#cec8e6">
    <text x="82" y="512">“Hi, this is Dana from Northwind — just</text>
    <text x="82" y="534">following up on the invoice from Tuesday.</text>
    <text x="82" y="556">Give me a call back when you get a sec at</text>
    <text x="82" y="578">(415) 555‑0142. Thanks!”</text>
  </g>
  <line x1="82" y1="600" x2="478" y2="600" stroke="#ffffff" stroke-opacity="0.10"/>
  <g font-size="14">
    <text x="82" y="628" fill="#9be7b0" font-weight="600">Caller</text><text x="160" y="628" fill="#cec8e6">Dana · Northwind</text>
    <text x="82" y="656" fill="#9be7b0" font-weight="600">Callback</text><text x="172" y="656" fill="#cec8e6">(415) 555‑0142</text>
    <text x="82" y="684" fill="#9be7b0" font-weight="600">Purpose</text><text x="168" y="684" fill="#cec8e6">Follow up on Tuesday's invoice</text>
  </g>

  <!-- input -->
  <rect x="60" y="748" width="392" height="46" rx="23" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.14"/>
  <text x="84" y="776" font-size="14" fill="#8a83a8">Ask your mail anything…</text>
  <circle cx="482" cy="771" r="20" fill="url(#accent)"/><text x="482" y="777" font-size="16" fill="#fff" text-anchor="middle">↑</text>
</svg>
